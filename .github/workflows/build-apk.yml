
name: Build Chess Mentor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
        unzip -q ChessMentor-v0.8-cloud-build.zip -d source

      - name: Build APK
        working-directory: source/ChessMentorAndroid-final
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMentor-debug-apk
          path: source/ChessMentorAndroid-final/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
